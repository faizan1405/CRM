name: AI Attention Engine Recurring Analysis

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  analyze-leads:
    name: Run Recurring AI Attention Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Attention Analysis
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.PRODUCTION_APP_URL || 'https://crm-five-eta-59.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured in repository secrets."
            exit 1
          fi
          echo "Triggering AI Attention Analysis on $APP_URL/api/cron/ai-attention..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/cron/ai-attention" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response status: $HTTP_STATUS"
          echo "Response body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Cron endpoint returned HTTP status $HTTP_STATUS"
            exit 1
          fi
